// ========== 插件声明 ==========
// com.android.application = 这是一个 Android App 模块（不是 Library）
plugins {
    id 'com.android.application'
}

android {
    // 命名空间：对应 Java 包名，R 类生成路径
    namespace 'com.example.cameraphonedata'
    compileSdk 34

    // ========== 默认配置（所有 buildType 共用） ==========
    defaultConfig {
        // 应用唯一标识，手机上靠这个区分 App
        applicationId "com.example.cameraphonedata"

        // minSdk = 最低支持的安卓版本（API 24 = Android 7.0）
        // targetSdk = 目标版本，建议跟 compileSdk 保持一致
        minSdk 24
        targetSdk 34

        // 版本号：versionCode 纯数字（商店判断更新），versionName 给人看的
        versionCode 2
        versionName "1.1.2"

        // ========== 从 local.properties 读取 OSS 配置，编译时注入 BuildConfig ==========
        // 作用：AK/SK 不写死在代码里，打包时自动嵌入，GitHub 仓库永远看不到密钥
        Properties localProps = new Properties()
        File localPropFile = rootProject.file("local.properties")
        if (localPropFile.exists()) {
            localPropFile.withInputStream { localProps.load(it) }
        }
        // buildConfigField 生成 BuildConfig.OSS_AK 等静态常量，Java 代码可直接读取
        buildConfigField "String", "OSS_AK",  "\"${localProps.getProperty('oss.ak', '')}\""
        buildConfigField "String", "OSS_SK",  "\"${localProps.getProperty('oss.sk', '')}\""
        buildConfigField "String", "OSS_BUCKET", "\"${localProps.getProperty('oss.bucket', '')}\""
        buildConfigField "String", "OSS_ENDPOINT", "\"${localProps.getProperty('oss.endpoint', '')}\""
        // ============================================
    }

    // ========== Gradle 8+ 必须显式开启 BuildConfig 生成 ==========
    // 旧版 Gradle 默认开启，新版默认关闭，不开则 BuildConfig 类不存在
    buildFeatures {
        buildConfig true
    }
    // =====================================================

    // ========== 编译类型（debug / release） ==========
    // debug 默认自动生成，不用写
    // release 用于打包 APK 发给别人
    buildTypes {
        release {
            // 启用代码混淆与资源压缩，防止源码泄露并减小 APK 体积
            minifyEnabled true
            shrinkResources true
            // ProGuard 规则文件
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ========== Java 版本兼容性 ==========
    // sourceCompatibility = 源码语法版本
    // targetCompatibility = 编译后的字节码版本
    // 统一用 Java 8，兼容所有 Android 设备和第三方库
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ========== 依赖库（第三方 SDK + AndroidX 官方库） ==========
dependencies {
    // AndroidX 基础
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX 相机套件（核心 + Camera2 驱动 + 生命周期绑定 + 视频录制 + 预览视图）
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ML Kit 姿态检测（人手检测用）
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'

    // Guava（CameraX 内部依赖，显式声明避免版本冲突）
    implementation 'com.google.guava:guava:31.1-android'

    // Okio（文件 IO 优化）
    implementation 'com.squareup.okio:okio:3.6.0'

    // 阿里云 OSS Android SDK（上传网盘用）
    implementation 'com.aliyun.dpa:oss-android-sdk:2.9.21'

    // ========== AndroidX Security：本地加密存储（AK/SK 加密存放） ==========
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // ============================================
    // OpenCV 本地模块依赖
    implementation project(':opencv')
}